trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    echo "Directly installing terraform via official snap package..."
    sudo snap install terraform --classic
    
    echo "Checking installation..."
    terraform --version
  displayName: 'Install Terraform via Snap'

- script: |
    echo "Running Terraform Commands..."
    terraform init
    terraform plan
  displayName: 'Terraform Init and Plan'